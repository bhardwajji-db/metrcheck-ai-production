services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metrcheck-backend
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ./data:/data
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - METRCHECK_DEMO_MODE=${METRCHECK_DEMO_MODE:-}
      - DATABASE_PATH=${DATABASE_PATH:-/data/metrcheck.db}
      - UPLOAD_DIR=${UPLOAD_DIR:-/data/uploads}
      - OCR_ENGINE=${OCR_ENGINE:-paddleocr}
      - RATE_LIMIT_BACKEND=${RATE_LIMIT_BACKEND:-sqlite}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: metrcheck-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

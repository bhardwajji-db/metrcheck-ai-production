services:
  - type: web
    name: metrcheck-ai
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    branch: main
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: METRCHECK_DEMO_MODE
        value: "true"
      - key: OCR_ENGINE
        value: paddleocr
      - key: MAX_FILE_SIZE_MB
        value: "50"
      - key: DATABASE_PATH
        value: /data/metrcheck.db
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: CORS_ORIGINS
        value: "https://metrcheck-ai-d6cx.onrender.com,https://metrcheck-ai.onrender.com,https://bhardwaj001-metrcheck-ai.hf.space,http://localhost:5173,http://localhost:3000"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK
        value: "True"
